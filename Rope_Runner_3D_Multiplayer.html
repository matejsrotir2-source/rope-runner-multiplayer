<style>

function rayBox(o,d,b,maxT){
 let t0=0,t1=maxT;
 for(const a of ['x','y','z']){
  if(Math.abs(d[a])<1e-8){if(o[a]<b.min[a]||o[a]>b.max[a])return -1;continue;}
  let a1=(b.min[a]-o[a])/d[a],a2=(b.max[a]-o[a])/d[a];
  if(a1>a2){const t=a1;a1=a2;a2=t;}
  if(a1>t0)t0=a1;if(a2<t1)t1=a2;if(t0>t1)return -1;
 }
 return t0>0.01?t0:-1;
}

 else AQ.last=0;
 if(c!==AQ.cur){AQ.cur=c;renderer.setPixelRatio(c);resize();}
 if(c<=0.7&&!AQ.low){AQ.low=true;sun.shadow.mapSize.set(1024,1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
 else if(c>0.85&&AQ.low){AQ.low=false;sun.shadow.mapSize.set(2048,2048);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}
}
function loop(now){
 requestAnimationFrame(loop);
 const raw=(now-last)/1000;last=now;adaptRes(raw);SDT+=(Math.min(0.033,raw)-SDT)*0.4;const dt=SDT;time+=dt;
 if(!paused){godF();if(drv&&!GAR.ph){carPhysics(dt);banDrive(dt);}godF();vehUpdate(dt);godF();shopUpdate();if(drv||RIDE){}else{physics(dt/2);physics(dt/2);}missionUpdate(dt);combat(dt);}
 garUpdate(dt);poseHero(dt);mpTick(now,dt);updateCamera(dt);animateWorld(dt,time);HUDT+=dt;if(HUDT>0.05){HUDT=0;hud();}drawOv();
 todUpdate(dt);sun.target.position.copy(P.pos);sun.position.copy(P.pos).add(SUNOFF);
 (SKYOBJ||(SKYOBJ=scene.getObjectByName('sky'))).position.copy(camera.position);
 fxUpdate(dt);
 renderer.render(scene,camera);
}

// ===== LOGIN / CREATOR =====
// Změna hesla: v konzoli prohlížeče spusť  sha256('jmeno:heslo')  a výsledek vlož do CREATOR_HASH.
const CREATOR_NAME='matysek';
const HELPER_NAME='nazik';
const HELPER_HASH='08c137af19c0378d10007a5dd524d59797e635b178260d4b7356df3cb2384a22';
const CREATOR_HASH='3e27c7ca3f5bd42636e743e906278057ee13f8791fbf086bb72ba178fa1f8bfe';
function sha256(str){
 const m=new TextEncoder().encode(str),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=0x80;
 const dv=new DataView(b.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
 const K=[],H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 for(let c=2,i=0;i<64;c++){let p=1;for(let d=2;d*d<=c;d++)if(c%d==0){p=0;break}if(p){K[i++]=(Math.cbrt(c)%1*4294967296)>>>0}}
 const w=new Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
 for(let o=0;o<n;o+=64){
  for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],c=w[i-2];w[i]=(w[i-16]+(R(a,7)^R(a,18)^(a>>>3))+w[i-7]+(R(c,17)^R(c,19)^(c>>>10)))>>>0}
  let [a,c,d,e,f,g,h,j]=H;
  for(let i=0;i<64;i++){const t1=(j+(R(f,6)^R(f,11)^R(f,25))+((f&g)^(~f&h))+K[i]+w[i])>>>0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&c)^(a&d)^(c&d)))>>>0;j=h;h=g;g=f;f=(e+t1)>>>0;e=d;d=c;c=a;a=(t1+t2)>>>0}
  [a,c,d,e,f,g,h,j].forEach((v,i)=>H[i]=(H[i]+v)>>>0);
 }
 return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}

const CH0=Object.assign({},CH);
const loginEl=$('login'),lu=$('lu'),lp=$('lp'),lerr=$('lerr');
try{lu.value=localStorage.getItem('rr3d_name')||'';}catch(_){}
try{if(window.CSS&&CSS.supports&&(CSS.supports('-webkit-text-security','disc')||CSS.supports('text-security','disc'))){lp.type='text';lp.classList.add('mask');}}catch(_){}
function setSkin(owner,hp){
 const m=hero.mats;
 m.suit.color.set(owner?0x3a1478:hp?0xd62839:0x2ec4b6);m.suit.emissive.set(owner?0x1c0a40:hp?0x4a0a10:0x000000);
 m.gold.color.set(owner?0x35e0ff:hp?0xffb703:0xffd166);m.gold.emissive.set(owner?0x0a4a55:hp?0x3a2a00:0x000000);
 m.dark.color.set(owner?0x07050f:hp?0x1a0a0a:0x0e1a2e);
 hero.crown.visible=owner;
}
function showLogin(){setSkin(false);Object.values(holds).forEach(x=>x.clear());$('st').hidden=true;rebind=null;curName='';$('panel').hidden=true;hk.hidden=true;paused=true;lp.value='';lerr.textContent='';loginEl.hidden=false;}
function enter(creator,name,helper){
 isCreator=creator;isHelper=!!helper;curName=name;setSkin(creator,helper);Object.assign(CH,CH0);
 $('bhk').hidden=!(creator||helper);$('bspawn').hidden=!(creator||helper);if(!(creator||helper)){removeM4();removeGW();}if(!creator)removeGTR();$('btod').hidden=!(creator||helper);if(!(creator||helper))todReset();
 try{localStorage.setItem('rr3d_name',name);}catch(_){}
 loginEl.hidden=true;paused=false;lp.value='';if(homeId)respawn();mpConnect();
 toast(creator?'Přihlášen: '+name+' 👑 (Hack menu odemčeno)':'Ahoj, '+(name||'hráči')+'!');
}
function logout(){MP.pass='';MP.admin=false;$('bpl').hidden=true;if(MP.ws)MP.ws.close();isCreator=false;isHelper=false;Object.assign(CH,CH0);$('bhk').hidden=true;$('bspawn').hidden=true;removeM4();removeGW();removeGTR();$('btod').hidden=true;todReset();showLogin();}
let fails=0,lockUntil=0;
async function tryLogin(){
 const name=lu.value.trim(),now=Date.now();
 if(now<lockUntil){lerr.textContent='Počkej '+Math.ceil((lockUntil-now)/1000)+' s…';return;}
 if(!name||!lp.value){lerr.textContent='Zadej jméno i heslo, nebo hraj jako host.';return;}
 const h=sha256(name.toLowerCase()+':'+lp.value);
 if(name.toLowerCase()===CREATOR_NAME&&h===CREATOR_HASH){fails=0;MP.pass=lp.value;enter(true,name);}
 else if(name.toLowerCase()===HELPER_NAME&&h===HELPER_HASH){fails=0;enter(false,name,true);}
 else{fails++;lerr.textContent='Špatné jméno nebo heslo.';lp.value='';if(fails>=3){lockUntil=Date.now()+Math.min(30000,(fails-2)*5000);}}
}
$('lgo').onclick=tryLogin;
lp.addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
$('lguest').onclick=()=>{const n=lu.value.trim();if(n.toLowerCase()===CREATOR_NAME||n.toLowerCase()===HELPER_NAME){lerr.textContent='Toto jméno je rezervované pro creatora.';return;}enter(false,n);};
showLogin();

// ===== NASTAVENÍ =====
const st=$('st');
const ANAMES={l:'Doleva',r:'Doprava',f:'Vpřed',b:'Zpět',rope:'Lano',aim:'Míření',fire:'Palba',trick:'Trik',respawn:'Respawn',missions:'Menu misí',guns:'Zbraně',assist:'Asistent navádění',hack:'Hack menu'};
const keyName=c=>c==='Space'?'Mezerník':c.startsWith('Key')?c.slice(3):c.startsWith('Digit')?c.slice(5):c==='ArrowUp'?'↑':c==='ArrowDown'?'↓':c==='ArrowLeft'?'←':c==='ArrowRight'?'→':c;
const SET={mm:true};try{Object.assign(SET,JSON.parse(localStorage.getItem('rr3d_set')||'{}'));}catch(_){}
function saveSet(){try{localStorage.setItem('rr3d_set',JSON.stringify(SET));localStorage.setItem('rr3d_keys',JSON.stringify(KB));}catch(_){}}
function applySet(){$('mm').style.display=SET.mm?'block':'none';}
function finishRebind(code){
 const id=rebind;rebind=null;
 if(code!=='Escape'&&id){const old=KB[id],other=Object.keys(KB).find(k=>k!==id&&KB[k]===code);if(other)KB[other]=old;KB[id]=code;saveSet();}
 renderSettings();
}
function renderSettings(){
 const ids=Object.keys(KB0).filter(id=>id!=='hack'||isCreator||isHelper);
 st.innerHTML='<div class="hh"><b>⚙ Nastavení</b><button id="stx">✕</button></div>'
 +'<div class="sec"><b>Účet</b><div class="srow"><span>'+(curName||'Host')+(isCreator?' 👑 creator':isHelper?' 🛠 helper':' (host)')+'</span><button id="slo">Odhlásit</button></div></div>'
 +'<div class="sec"><b>Hra</b><div class="srow"><span>Asistent navádění</span><button id="sas">'+(assist?'ON':'OFF')+'</button></div><div class="srow"><span>Minimapa</span><button id="smm">'+(SET.mm?'ON':'OFF')+'</button></div></div>'
 +'<div class="sec"><b>Klávesy</b><small>Klepni na klávesu a stiskni novou (Esc = zrušit). Šipky vždy fungují na pohyb.</small>'
 +ids.map(id=>'<div class="srow"><span>'+ANAMES[id]+'</span><button data-k="'+id+'"'+(rebind===id?' class="wait"':'')+'>'+(rebind===id?'stiskni klávesu…':keyName(KB[id]))+'</button></div>').join('')
 +'<div class="srow"><span></span><button id="skr">Obnovit výchozí</button></div></div>';
 $('stx').onclick=toggleSettings;
 $('slo').onclick=()=>{st.hidden=true;logout();};
 $('sas').onclick=()=>{assist=!assist;renderSettings();};
 $('smm').onclick=()=>{SET.mm=!SET.mm;applySet();saveSet();renderSettings();};
 $('skr').onclick=()=>{Object.assign(KB,KB0);rebind=null;saveSet();renderSettings();};
 st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{rebind=b.dataset.k;renderSettings();});
}
function toggleSettings(){
 if(st.hidden){Object.values(holds).forEach(x=>x.clear());$('panel').hidden=true;hk.hidden=true;rebind=null;renderSettings();st.hidden=false;paused=true;}
 else{st.hidden=true;rebind=null;paused=false;}
}
$('bst').addEventListener('click',toggleSettings);
applySet();

requestAnimationFrame(loop);
})();
