#inv button{position:relative;width:38px;height:38px;padding:0;border-radius:9px;background:rgba(20,33,61,.55);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:20px;line-height:1;touch-action:none;-webkit-tap-highlight-color:transparent}

#inv button.on{border-color:#35e0ff;box-shadow:0 0 0 2px #35e0ff66;background:rgba(53,224,255,.2)}
#inv button.mv{border-color:#ffd166;box-shadow:0 0 0 2px #ffd16688;background:rgba(255,209,102,.25)}
#inv button:empty,#inv button.e{opacity:.45}
body.wide #hudR{top:calc(max(8px,env(safe-area-inset-top)) + 100px)}
</style>
</head>

function getBaseTex(base,gable){
 const k=base+(gable?'g':'f');
 if(baseTex[k])return baseTex[k];
 const cv=document.createElement('canvas');cv.width=cv.height=512;const g=cv.getContext('2d');

 g.fillStyle=base;g.fillRect(0,0,512,512);
 // Hrubá brizolitová/zateplená omítka + reliéf pro bump mapu
 for(let i=0;i<1100;i++){

  g.fillStyle='rgba('+(Math.random()<.5?'0,0,0':'255,255,255')+','+(Math.random()*0.055)+')';g.fillRect(rx,ry,rw,rh);
 }
 grain(g,512,512,11000,['0,0,0','255,255,255','85,75,55'],0.03,0.13,2.2);
 grain(gb,512,512,9000,['40,40,40','220,220,220'],0.08,0.25,2);
 for(let i=0;i<30;i++){const x=Math.random()*512,y=Math.random()*512,r=12+Math.random()*42,gr=g.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,'rgba(55,45,32,.11)');gr.addColorStop(1,'rgba(55,45,32,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}
 for(let i=0;i<45;i++){const x=Math.random()*512;g.fillStyle='rgba(48,42,35,'+(0.03+Math.random()*0.065)+')';g.fillRect(x,Math.random()*512,1+Math.random()*2,35+Math.random()*95);}

 for(let cx=0;cx<4;cx++)for(let cy=0;cy<4;cy++)drawCell(g,gb,cx*128,cy*128,gable,ge);

 const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=MAXANI;
 const b=new THREE.CanvasTexture(cb);b.wrapS=b.wrapT=THREE.RepeatWrapping;b.anisotropy=MAXANI;
 const e=new THREE.CanvasTexture(ce);e.wrapS=e.wrapT=THREE.RepeatWrapping;e.anisotropy=MAXANI;
 emTex[k]=e;bumpTex[k]=b;baseTex[k]=t;return t;
}

function wallMat(base,nb,nf,gable){
 const key=base+'|'+nb+'|'+nf+'|'+gable;
 if(texCache[key])return texCache[key];
 const t=getBaseTex(base,gable).clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(nb/4,nf/4);t.anisotropy=MAXANI;
 const b=bumpTex[base+(gable?'g':'f')].clone();b.needsUpdate=true;b.wrapS=b.wrapT=THREE.RepeatWrapping;b.repeat.set(nb/4,nf/4);b.anisotropy=MAXANI;
 const e=emTex[base+(gable?'g':'f')].clone();e.needsUpdate=true;e.wrapS=e.wrapT=THREE.RepeatWrapping;e.repeat.set(nb/4,nf/4);e.anisotropy=MAXANI;
 const m=new THREE.MeshStandardMaterial({map:t,bumpMap:b,bumpScale:0.16,roughness:0.86,metalness:0.04,emissive:0xffffff,emissiveMap:e,emissiveIntensity:NIGHTK});
 EMMATS.push(m);texCache[key]=m;return m;
}
